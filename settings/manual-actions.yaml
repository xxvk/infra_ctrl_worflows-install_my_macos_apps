schema_version: 1

# Manual checkpoints are durable instructions, not credentials or claims that
# the action is complete on the current machine.
secrets_policy:
  store_passwords: false
  store_tokens: false
  store_recovery_codes: false
  store_license_keys: false

# Declares which system is the authoritative source for account passwords
# and passkeys, so every "sign in" checkpoint below has a known dependency.
# This is a policy declaration only; it never stores actual credentials.
secrets_manager:
  authoritative_source: system_keychain
  description: >
    The macOS system Keychain, synced across the user's Apple devices via
    iCloud Keychain, is the authoritative source for account passwords and
    passkeys. No third-party password manager (1Password, Bitwarden, etc.)
    is in use.
  new_mac_recovery_steps:
    - Sign in to the Mac with the same Apple Account used on existing Macs.
    - Enable iCloud Keychain (System Settings > Apple Account > iCloud >
      Passwords and Keychain, or the equivalent current path).
    - Approve the device-trust/verification prompt from an existing trusted
      device or with the device passcode.
    - Confirm previously saved entries appear in the Passwords app or Safari
      AutoFill before relying on them for any checkpoint below.

checkpoints:
  - id: wifi-network-connectivity
    phase: bootstrap
    category: network
    action: On a genuinely new/wiped Mac, join a Wi-Fi network (or connect
      Ethernet) before any other checkpoint in this file. Nothing else --
      App Store sign-in, Homebrew, AI app sign-in, VPN clients -- can
      proceed without it.
    verify: Confirm internet connectivity (e.g. reach apple.com and
      github.com) before continuing to scripts/bootstrap_macos.py or any
      install step.
    state_record: machine-local-state/manual-actions-*.json
  - id: secrets-manager-availability
    phase: bootstrap
    category: account
    action: Confirm iCloud Keychain is enabled and syncing before relying on
      it for any other sign-in checkpoint in this file.
    verify: Open the Passwords app (or System Settings > Passwords) and
      confirm previously saved entries from other Apple devices are present.
    state_record: machine-local-state/manual-actions-*.json
  - id: app-store-sign-in
    phase: install
    category: account
    action: Sign in to the Mac App Store with the user's Apple Account.
    verify: Confirm the selected App Store apps show as installed and retain their receipt.
    state_record: machine-local-state/manual-actions-*.json
  - id: browser-profile-sign-in
    phase: post_install
    category: account
    action: Sign in to Chrome/Safari profiles and verify the expected email-to-profile mapping.
    verify: Run the Chrome profile integrity check and extension checks.
    forbidden_data: cookies, passwords, session tokens
  - id: ai-account-sign-in
    phase: post_install
    category: account
    action: Sign in to ChatGPT, Claude, Perplexity, and other selected AI apps.
    verify: Confirm the intended account/workspace and required feature state.
    forbidden_data: passwords, tokens, subscription receipts
  - id: privacy-authorizations
    phase: authorization
    category: macos_privacy
    action: Approve only the permission rows identified by the current bootstrap report.
    verify: Re-run scripts/macos_permissions.py and compare the TCC matrix.
  - id: vpn-and-network
    phase: post_install
    category: network
    action: Sign in and connect Tailscale, ZeroTier, AdGuard VPN, or other selected clients.
    verify: Confirm the intended connection and DNS policy without storing credentials.
  - id: developer-licenses
    phase: post_install
    category: license
    action: Accept required developer-tool licenses and complete vendor
      activation. Walk settings/license-reminders.yaml's apps list
      explicitly rather than relying on memory to catch every app needing
      manual activation.
    verify: Run the component-specific check command.
    forbidden_data: license keys, activation tokens
  - id: claude-third-party-inference
    phase: post_install
    category: app_configuration
    action: Configure third-party inference only when explicitly selected by the user.
    verify: Confirm the selected provider/model in the app UI; do not write provider secrets to the repo.
