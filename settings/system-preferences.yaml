schema_version: 1

# Portable desired policy only. Do not fill this file with an unrestricted
# `defaults export`; current values and machine-specific paths belong in state.
scope: explicit_allowlist
source_of_truth: tracked_settings
machine_observations: ignored_state
desired_values_file: Private/system-preferences-values.json

bootstrap_order:
  - machine_baseline
  - locale_and_input_sources
  - dock_order
  - keyboard_and_input_sources
  - finder_and_appearance
  - default_applications
  - login_items
  - final_verification

preferences:
  - id: machine-baseline
    status: observed_state_only
    apply_method: not_applicable
    verify_method: scripts/macos_preferences.py
  - id: locale-and-input-sources
    status: observed
    apply_method: planned_allowlisted_defaults
    verify_method: scripts/macos_preferences.py --check
  - id: keyboard-shortcuts-and-text-input
    status: observed
    apply_method: device_specific_policy
    verify_method: hidutil_and_allowlisted_defaults
  - id: desktop-window-screenshot
    status: observed
    apply_method: planned_allowlisted_defaults
    verify_method: scripts/macos_preferences.py --check
  - id: display-sound-power
    status: observed_state_only
    apply_method: planned_allowlisted_system_settings
    verify_method: scripts/macos_preferences.py
  - id: notifications-control-center
    status: observed
    apply_method: planned_allowlisted_defaults
    verify_method: scripts/macos_preferences.py --check
  - id: focus-screensaver
    status: observed
    apply_method: planned_manual_focus_and_allowlisted_defaults
    verify_method: scripts/macos_preferences.py
  - id: display-effects
    status: observed_interface_limited
    apply_method: manual_system_settings
    verify_method: scripts/macos_preferences.py
  - id: audio-devices
    status: observed_state_only
    apply_method: manual_system_settings
    verify_method: scripts/macos_preferences.py
  - id: default-applications
    status: observed_partial
    apply_method: explicit_launchservices_policy
    verify_method: scripts/macos_preferences.py --check
  - id: developer-environment
    status: observed_state_only
    apply_method: planned_toolchain_bootstrap
    verify_method: scripts/macos_preferences.py
  - id: network-vpn-dns
    status: observed_state_only
    apply_method: planned_network_policy
    verify_method: scripts/macos_preferences.py
  - id: security-posture
    status: observed_state_only
    apply_method: manual_security_settings
    verify_method: scripts/macos_preferences.py
  - id: browser-webapp-continuity
    status: observed_state_only
    apply_method: manual_browser_and_webapp_setup
    verify_method: scripts/macos_preferences.py
  - id: dock-order
    policy_file: Private/dock-order.json
    status: tracked
    apply_method: explicit_dock_reconciliation
    verify_method: scripts/macos_dock.py
  - id: keyboard
    policy_file: Private/keyboard.yaml
    status: tracked
    apply_method: device_specific_policy
    verify_method: hidutil_and_listener_test
  - id: input-sources
    status: planned
    apply_method: planned_allowlisted_defaults
    verify_method: planned_input_source_check
  - id: contacts-name-order
    status: tracked
    desired_values_file: Private/system-preferences-values.json
    apply_method: allowlisted_global_defaults
    verify_method: scripts/macos_preferences.py --check
    note: "NSPersonNameDefaultDisplayNameOrder and NSPersonNameDefaultShortNameFormat affect Contacts/name presentation; they do not alter givenName/familyName stored on a Person record."
  - id: calendar-display-and-defaults
    status: observed_partial
    apply_method: reviewed_allowlisted_defaults_and_manual_account_selection
    verify_method: scripts/macos_preferences.py --check; Calendar visual check
    note: "Track Calendar UI/default policy only; calendar IDs, account identifiers, event content, and event databases are machine/account-specific or private."
  - id: reminders-display-and-defaults
    status: observed_no_safe_scalar_preferences
    apply_method: manual_account_and_app_setup
    verify_method: Reminders visual check and account-specific workflow
    note: "The current preference domain exposes no safe portable sort/default-list policy; do not copy Reminders databases or account data."
  - id: mail-interface-and-compose-policy
    status: observed_partial
    apply_method: reviewed_allowlisted_mail_defaults_and_manual_account_setup
    verify_method: scripts/macos_preferences.py --check; Mail visual check
    note: "Track Mail UI/thread/sort policy only; accounts, mailbox identifiers, messages, search terms, signatures, tokens, and mail databases are excluded."
  - id: safari-behavior-policy
    status: observed_partial
    apply_method: reviewed_allowlisted_safari_defaults_and_manual_extension_setup
    verify_method: scripts/macos_preferences.py --check; Safari visual check
    note: "Track browser behavior only; history, cookies, passwords, bookmarks contents, tab groups, website permissions, extension storage, and private download paths are excluded."
  - id: finder-file-management-policy
    status: observed_partial
    apply_method: reviewed_allowlisted_finder_defaults
    verify_method: scripts/macos_preferences.py --check; Finder visual check
    note: "Track Finder display/sidebar/desktop policy only; recent items, search scopes, mounted-volume positions, tag contents, private paths, and window coordinates are excluded."
  - id: notes-display-and-checklist-policy
    status: observed_partial
    apply_method: reviewed_allowlisted_notes_defaults_and_manual_account_setup
    verify_method: scripts/macos_preferences.py --check; Notes visual check
    note: "Track only safe Notes behavior policy; accounts, folders, note content, attachments, sharing, and Notes databases are excluded."
  - id: messages-filter-and-retention-policy
    status: observed_partial
    apply_method: reviewed_allowlisted_messages_defaults_and_manual_account_setup
    verify_method: scripts/macos_preferences.py --check; Messages visual check
    note: "Track filtering and retention policy only; message content, participants, attachments, transcripts, account identifiers, and Messages databases are excluded."
  - id: photos-library-and-display-policy
    status: observed_partial
    apply_method: reviewed_allowlisted_photos_defaults_and_manual_icloud_setup
    verify_method: scripts/macos_preferences.py --check; Photos visual check
    note: "Track Photos display/library policy only; library paths, iCloud accounts, photo content, thumbnails, albums, faces, locations, and shared-library content are excluded."
  - id: media-app-playback-and-download-policy
    status: observed_partial
    apply_method: reviewed_allowlisted_media_defaults_and_manual_account_setup
    verify_method: scripts/macos_preferences.py --check; Music/TV/Podcasts visual check
    note: "Track only playback/download behavior; media libraries, purchase history, account state, and content metadata are excluded."
  - id: preview-textedit-document-display-policy
    status: observed_partial
    apply_method: reviewed_allowlisted_document-app_defaults
    verify_method: scripts/macos_preferences.py --check; Preview/TextEdit visual check
    note: "Track document-view behavior only; recent files, document contents, paths, and window coordinates are excluded."
  - id: shortcuts-automator-layout-and-automation-policy
    status: observed_partial
    apply_method: reviewed_allowlisted_shortcuts_defaults_and_manual_automation_setup
    verify_method: scripts/macos_preferences.py --check; named Shortcut/Automator workflow
    note: "Track layout and automation presence only; shortcut actions may contain secrets or private data and are not exported."
  - id: app-store-software-update-policy
    status: observed_partial
    apply_method: manual_system_settings_and_app_store_setup
    verify_method: scripts/macos_preferences.py --check; System Settings visual check
    note: "Current domains expose no safe automatic-update policy field; do not record Apple ID, purchases, receipts, update product IDs, or account state."
  - id: browser-wrapper-and-playcover-policy
    status: observed_partial
    apply_method: reviewed_webcatalog_and_playcover_settings_with_manual_account_setup
    verify_method: scripts/macos_preferences.py --check; launch WebCatalog/PlayCover apps and run named smoke checks
    note: "Track default-browser routing, wrapper names, and safe PlayCover app settings; never copy browser sessions, Keychain data, app containers, or account state."
  - id: finder-and-appearance
    status: tracked
    desired_values_file: Private/system-preferences-values.json
    apply_method: planned_allowlisted_defaults
    verify_method: scripts/macos_preferences.py --check
  - id: default-applications
    status: planned
    apply_method: explicit_application_association
    verify_method: planned_open-test
  - id: login-items
    status: partial_manual_review
    apply_method: reviewed_launchagent_or_login_item
    verify_method: scripts/macos_startup_items.py; Apple Events required for GUI login items

rules:
  - Never persist recent-document lists, private paths, serial numbers, or secrets.
  - Add a preference only after read, apply, and verify behavior is understood.
  - Keep current exports and comparison results in machine-local state.
