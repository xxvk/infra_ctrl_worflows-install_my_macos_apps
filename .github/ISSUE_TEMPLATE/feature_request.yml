name: Feature request
description: Propose a user need, safety boundary, or documentation improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the need with no secrets or private machine state. Use fictional examples; do not paste Private/ configuration, account identifiers, personal paths, or document content.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: This request contains no secrets or private machine state.
          required: true
        - label: I described the user need separately from the proposed implementation.
          required: true
    validations:
        required: true
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Who has the problem, what are they trying to achieve, and what currently fails?
    validations:
        required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Define an observable result without assuming a particular implementation.
    validations:
        required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Permissions, privacy, and mutation boundaries
      description: State what must remain read-only, private, manually confirmed, reversible, or unsupported.
    validations:
        required: true
  - type: textarea
    id: example
    attributes:
      label: Fictional example
      description: Use placeholder accounts, paths, and data only.
    validations:
        required: false
