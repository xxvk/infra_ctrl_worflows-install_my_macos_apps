name: Redacted bug report
description: Report a reproducible non-security problem without private machine data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use SECURITY.md instead for vulnerabilities, unsafe mutations, exposed credentials, private-data disclosure, or redaction bypass. Never attach Private/ content, raw TCC databases, credentials, account identifiers, private URLs, document content, or unredacted logs.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I searched existing documentation and issues.
          required: true
        - label: I removed credentials, account identifiers, private URLs, Private/ content, raw TCC data, personal filenames, document content, and unrelated machine state; all included output is manually redacted.
          required: true
        - label: This is not a security-sensitive report; otherwise I will use SECURITY.md.
          required: true
    validations:
        required: true
  - type: input
    id: version
    attributes:
      label: macomrade version or commit
      placeholder: 0.2.0 or a commit hash
    validations:
        required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Output of sw_vers -productVersion, without device names or account data.
    validations:
        required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - arm64 (Apple silicon)
        - x86_64 (Intel, currently unverified)
        - Unknown
    validations:
        required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command or read-only route
      description: Remove paths, identifiers, credentials, and unrelated arguments.
      render: shell
    validations:
        required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
        required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and minimal redacted evidence
      description: Prefer an error category and exit status. Do not paste a full log or state record.
    validations:
        required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use fictional fixtures where possible and state whether the command was scan, plan, dry-run, or apply.
    validations:
        required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Optional diagnostic preview summary
      description: Do not attach a ZIP merely because export succeeded. Review references/public-support-safety.md and make a separate sharing decision.
    validations:
        required: false
