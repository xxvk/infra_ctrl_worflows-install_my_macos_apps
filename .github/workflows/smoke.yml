name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run read-only smoke test
        run: bash tests/smoke.sh

      # tests/smoke.sh only ever exercises read-only/dry-run paths (no
      # --apply, --confirm, or brew installs are actually run) -- see the
      # script itself and this skill's Safety rules in SKILL.md. Nothing in
      # this workflow requires elevated permissions or writes outside the
      # checked-out working directory's ignored state/.
